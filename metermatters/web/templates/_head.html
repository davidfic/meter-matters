<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icon.svg') }}">
<script>
  // Before first paint, so a chosen theme never flashes the other one.
  try { const t = localStorage.getItem("elec-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
</script>
