{#- Small line icons for the rail. One macro, 20px, currentColor. -#}
{% macro ico(name) -%}
<svg class="ico" viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == "overview" %}<rect x="3" y="3" width="6" height="7" rx="1.5"/><rect x="11" y="3" width="6" height="4" rx="1.5"/><rect x="3" y="12" width="6" height="5" rx="1.5"/><rect x="11" y="9" width="6" height="8" rx="1.5"/>
{%- elif name == "electric" %}<path d="M11 2.5 4.5 11H10l-1 6.5L15.5 9H10z"/>
{%- elif name == "gas" %}<path d="M10 2.5c.5 3-3.5 4.7-3.5 8.5a3.5 3.5 0 0 0 7 0c0-1.5-.7-2.4-1.5-3.2 0 1.4-.6 2-1.3 2.2.7-2.8-.2-5.5-.7-7.5z"/>
{%- elif name == "water" %}<path d="M10 2.5S4.5 8.3 4.5 12a5.5 5.5 0 0 0 11 0C15.5 8.3 10 2.5 10 2.5z"/>
{%- elif name == "year" %}<rect x="3" y="4" width="14" height="13" rx="2"/><path d="M3 8h14M7 2.5v3M13 2.5v3"/>
{%- elif name == "rates" %}<path d="M3 15 8 9l3 3 6-7"/><path d="M13 5h4v4"/>
{%- elif name == "raw" %}<rect x="3" y="3" width="14" height="14" rx="2"/><path d="M3 8h14M3 12.5h14M8 8v9"/>
{%- elif name == "add" %}<circle cx="10" cy="10" r="7"/><path d="M10 6.5v7M6.5 10h7"/>
{%- elif name == "homes" %}<path d="M3 9.5 10 3l7 6.5V17H3z"/><path d="M8 17v-5h4v5"/>
{%- elif name == "theme" %}<circle cx="10" cy="10" r="3.2"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/>
{%- endif -%}
</svg>
{%- endmacro %}
