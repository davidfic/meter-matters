{#- The utility switcher: every utility the app knows, on every page. -#}
{% if fuels_nav %}
<select id="fuel-switch" aria-label="Utility">
  {% if fuels_nav.placeholder %}<option value="" selected disabled>Utilities…</option>{% endif %}
  <option value="{{ fuels_nav.overview.url }}"{{ " selected" if fuels_nav.overview.current }}>All utilities</option>
  {% for f in fuels_nav['items'] %}
  <option value="{{ f.url }}"{{ " selected" if f.current }}>{{ f.tagline.split(" ")[0] }} {{ f.name }}{{ "" if f.has_bills else " · none yet" }}</option>
  {% endfor %}
</select>
<script type="module" src="{{ url_for('static', filename='fuel-nav.js') }}"></script>
{% endif %}
