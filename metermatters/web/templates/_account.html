{#- The signed-in user's corner of the header, and the way to the documentation.
    The account part is empty when there are no accounts. -#}
{% if accounts_on and user %}
<a class="btn" href="{{ url_for('web.connect') }}">Add bills</a>
{% endif %}
<a class="btn" href="{{ url_for('docs.index') }}">Docs</a>
{% if accounts_on and user %}
<form method="post" action="{{ url_for('web.logout') }}" class="inline">
  <button type="submit" title="Signed in as {{ user.email }}">Sign out</button>
</form>
{% endif %}
