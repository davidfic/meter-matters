# Where the pipeline lives. Read by ci-setup.sh and deploy.sh; nothing here is
# secret. Any of it can be overridden from the environment for one run:
#
#     REGION=us-east1 ./deploy/deploy.sh
#
# gcloud's own default project is ignored on purpose - every command these
# scripts run names PROJECT explicitly.

: "${PROJECT:=utility-tracker-510019}"
: "${REGION:=us-central1}"
: "${SERVICE:=elec-bill}"            # the Cloud Run service, which already exists

# Artifact Registry: REGION-docker.pkg.dev/PROJECT/REPOSITORY/IMAGE:<commit>
: "${REPOSITORY:=elec-bill}"
: "${IMAGE:=elec-bill}"
: "${KEEP_IMAGES:=10}"               # newest images kept; older ones are deleted

# The account builds run as. It can push to that one repository, deploy to
# that one service, and write to that one bucket - and nothing else.
: "${BUILD_ACCOUNT:=elec-bill-deployer}"
BUILD_ACCOUNT_EMAIL="${BUILD_ACCOUNT}@${PROJECT}.iam.gserviceaccount.com"

# Build logs, and the source uploaded by deploy.sh. If you change this, change
# `logsBucket` in cloudbuild.yaml to match: a build cannot start without it.
: "${BUCKET:=${PROJECT}-elec-bill-ci}"
: "${BUCKET_KEEP_DAYS:=60}"

# The git path. GITHUB_REPO is owner/name; BRANCH is the one a push deploys.
: "${GITHUB_REPO:=davidfic/meter-matters}"
: "${BRANCH:=main}"
: "${CONNECTION:=github}"
: "${TRIGGER:=elec-bill-deploy}"

IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT}/${REPOSITORY}/${IMAGE}"
